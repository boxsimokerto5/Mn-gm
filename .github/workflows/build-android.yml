name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipe Build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - apk
          - aab

jobs:
  build:
    name: Build Release APK & AAB
    runs-on: ubuntu-latest

    env:
      # Password default yang konsisten jika belum diset di GitHub Secrets
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'GameCuanRelease2026!' }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'GameCuanRelease2026!' }}
      KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure .env exists
        run: |
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      # -------------------------------------------------------------
      # 1. KUNCI TANDA TANGAN (SIGNATURE KEY) OTOMATIS & PERMANEN
      # Cache GitHub Actions digunakan agar file keystore tersimpan
      # dan tidak pernah berubah di build-build selanjutnya.
      # -------------------------------------------------------------
      - name: Restore Keystore from Cache
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: my-upload-key.jks
          key: android-release-keystore-v1

      - name: Setup or Generate Signature Key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "Memeriksa status signature key..."
          
          # Prioritas 1: Jika ada di GitHub Secrets (sangat aman & permanen selamanya)
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Menggunakan KEYSTORE_BASE64 dari GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "NEW_KEYSTORE_CREATED=false" >> $GITHUB_ENV
          
          # Prioritas 2: Jika sudah ada di cache dari build sebelumnya (tidak berubah)
          elif [ -f "my-upload-key.jks" ]; then
            echo "Keystore berhasil direstore dari cache GitHub Actions! Signature key tetap sama dengan build sebelumnya."
            echo "NEW_KEYSTORE_CREATED=false" >> $GITHUB_ENV
          
          # Prioritas 3: Belum pernah dibuat sebelumnya -> Buat sekali secara otomatis
          else
            echo "Keystore belum ada. Membuat signature key baru secara otomatis untuk pertama kali..."
            keytool -genkeypair \
              -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=GameCuan GecckoCreator, OU=Mobile, O=GameCuan, L=Jakarta, ST=Jakarta, C=ID"
            
            echo "Signature key baru berhasil dibuat!"
            echo "NEW_KEYSTORE_CREATED=true" >> $GITHUB_ENV
          fi

      # -------------------------------------------------------------
      # Tampilkan informasi fingerprint & Backup Base64 (Sekali Dibuat)
      # -------------------------------------------------------------
      - name: Inspect Keystore Fingerprints & Backup Base64
        run: |
          echo "### 📱 Informasi Signature Key & Aplikasi" >> $GITHUB_STEP_SUMMARY
          echo "- **Package Name**: \`com.gamecuan.gecckocreator\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Versi**: \`1.0\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Keystore Alias**: \`upload\`" >> $GITHUB_STEP_SUMMARY
          
          echo "#### Fingerprint Sertifikat:" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          keytool -list -v -keystore my-upload-key.jks -alias upload -storepass "$STORE_PASSWORD" | grep -E "(SHA1|SHA256):" >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

          if [ "$NEW_KEYSTORE_CREATED" = "true" ]; then
            echo "#### ⚠️ PENTING: Cadangkan Signature Key Ini!" >> $GITHUB_STEP_SUMMARY
            echo "Signature key telah dibuat sekali dan disimpan di cache GitHub Actions (\`android-release-keystore-v1\`)." >> $GITHUB_STEP_SUMMARY
            echo "Agar tidak hilang jika cache repo tidak aktif lebih dari 90 hari, salin string Base64 di bawah ini ke **Repo Settings -> Secrets and variables -> Actions -> Repository Secrets** dengan nama \`KEYSTORE_BASE64\`:" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            base64 -w 0 my-upload-key.jks >> $GITHUB_STEP_SUMMARY
            echo '' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      # -------------------------------------------------------------
      # 2. PROSES BUILD APK & AAB
      # -------------------------------------------------------------
      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == null }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Release AAB (Google Play Bundle)
        if: ${{ github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == null }}
        run: ./gradlew bundleRelease --stacktrace

      # -------------------------------------------------------------
      # 3. UPLOAD ARTIFACTS HASIL BUILD
      # -------------------------------------------------------------
      - name: Upload Release APK
        if: ${{ github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == null }}
        uses: actions/upload-artifact@v4
        with:
          name: GameCuan-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release AAB (Google Play)
        if: ${{ github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == null }}
        uses: actions/upload-artifact@v4
        with:
          name: GameCuan-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload Keystore Backup File
        if: env.NEW_KEYSTORE_CREATED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: my-upload-key-backup
          path: my-upload-key.jks
          retention-days: 90
